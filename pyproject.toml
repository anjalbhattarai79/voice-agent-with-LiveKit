[project]
name = "test-voice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dotenv>=0.9.9",
    "livekit[elevenlabs]>=1.1.2",
    "livekit-agents[deepgram,elevenlabs,openai,silero]~=1.8",
    "sherpa-onnx>=1.13.8",
    "sounddevice>=0.5.5",
    "numpy>=2.4.3",
    "sherpa-onnx-core>=1.13.8",
    "torch==2.13.0",
    "transformers>=5.19.0",
    "soundfile>=0.14.0",
    "silero-vad>=6.2.3",
    "deepgram-sdk>=7.12.0",
    "python-dotenv>=1.2.2",
]

[tool.uv.workspace]
members = [
    "stt/sherpa-stt",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
